    // ====== المنتجات (الأسعار بالدينار للكيلو) ======
    const PRODUCTS = [
      { id: 'jameed', name: 'جميد كركي بلدي', desc: 'جميد كركي بلدي، يُباع بالكيلو.', price: 11, art: 'jameed' },
      { id: 'jameed-traditional', name: 'الجميد الكركي الأصلي نخب أول', desc: 'الجميد الكركي الأصلي نخب أول، يُباع بالكيلو.', price: 12, art: 'jameed2' },
      { id: 'ghee', name: 'سمن بلدي أصلي', desc: 'سمن بلدي أصلي، يُباع بالكيلو.', price: 12, art: 'ghee' }
    ];

    const fmt = (n) => n.toFixed(2);
    const qtyFmt = (q) => (Number.isInteger(q) ? String(q) : q.toFixed(1));
    const cart = {};
    let copied = '';

    const $ = (id) => document.getElementById(id);
    const CHECK = '<svg class="w-4 h-4 text-green-400" fill="none" stroke="currentColor" stroke-width="3" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>';
    const COPY = '<svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>';

    function renderProducts() {
      $('product-grid').innerHTML = PRODUCTS.map((p, i) => {
        const span = (i === PRODUCTS.length - 1 && PRODUCTS.length % 2 === 1) ? 'col-span-2' : '';
        return `
        <div class="bg-[#231913] rounded-2xl border border-stone-800 overflow-hidden shadow-md flex flex-col justify-between p-2.5 ${span}">
          <div>
            <div class="relative h-28 rounded-xl overflow-hidden mb-2 bg-stone-900"><img src="${IMG[p.art]}" alt="${p.name}" class="w-full h-full object-cover"></div>
            <h3 class="font-bold text-[11px] text-stone-100 mb-1 text-right line-clamp-1">${p.name}</h3>
            <p class="text-[9px] text-stone-400 text-right line-clamp-2 leading-tight mb-2">${p.desc}</p>
          </div>
          <div class="space-y-1.5 pt-2 border-t border-stone-800">
            <div class="text-left font-black text-xs text-amber-400">${fmt(p.price)} د.أ <span class="text-[9px] font-bold text-stone-400">/ كيلو</span></div>
            <button data-action="add" data-id="${p.id}" class="w-full bg-[#b8860b] hover:bg-[#a67c00] text-stone-950 text-[11px] font-black py-1.5 rounded-lg transition-colors">إضافة للسلة</button>
          </div>
        </div>`;
      }).join('');
    }

    function lines() {
      return PRODUCTS.filter(p => cart[p.id] > 0).map(p => ({ ...p, qty: cart[p.id], lineTotal: cart[p.id] * p.price }));
    }

    function renderCart() {
      const ls = lines();
      const total = ls.reduce((s, l) => s + l.lineTotal, 0);
      const count = ls.reduce((s, l) => s + l.qty, 0);
      $('cart-count').textContent = qtyFmt(count);

      let html = `
        <div class="flex items-center justify-between">
          <h2 class="font-black text-base text-stone-100">سلة المشتريات</h2>
          <button data-action="close" aria-label="إغلاق" class="text-stone-400 hover:text-stone-100 text-xl leading-none">✕</button>
        </div>`;

      if (!ls.length) {
        html += '<p class="text-center text-xs text-stone-400 py-6">السلة فارغة</p>';
      } else {
        html += '<div class="space-y-2">' + ls.map(l => `
          <div class="bg-[#231913] border border-stone-800 rounded-xl p-2.5 flex items-center gap-2.5">
            <div class="w-14 h-14 rounded-lg overflow-hidden shrink-0"><img src="${IMG[l.art]}" alt="${l.name}" class="w-full h-full object-cover"></div>
            <div class="flex-1 min-w-0">
              <div class="text-[11px] font-bold text-stone-100 truncate">${l.name}</div>
              <div class="text-[10px] text-stone-400">${fmt(l.price)} د.أ / كيلو</div>
              <div class="flex items-center gap-2 mt-1">

                <span class="text-[11px] font-black text-stone-100 min-w-[44px] text-center">${qtyFmt(l.qty)} كيلو</span>
                <button data-action="qty" data-id="${l.id}" data-delta="-0.5" aria-label="إنقاص" class="w-5 h-5 rounded-full bg-stone-700 text-stone-100 flex items-center justify-center font-black leading-none">−</button>
              </div>
            </div>
            <div class="text-xs font-black text-amber-400 whitespace-nowrap">${fmt(l.lineTotal)} د.أ</div>
          </div>`).join('') + '</div>';

        html += `
        <div class="flex items-center justify-between border-t border-stone-800 pt-3">
          <span class="text-sm font-bold text-stone-200">الإجمالي</span>
          <span class="text-lg font-black text-amber-400">${fmt(total)} د.أ</span>
        </div>

        <div class="bg-[#231913] border border-amber-700/40 rounded-2xl p-3 space-y-3">
          <div class="text-amber-300 font-black text-sm">🏦 الدفع بالتحويل عبر كليك (CliQ)</div>
          <div class="grid grid-cols-2 gap-2 text-[11px]">
            <div class="bg-[#1a120e] rounded-lg p-2">
              <div class="text-stone-400 mb-0.5">البنك</div>
              <div class="font-black text-stone-100">${CLIQ_BANK}</div>
            </div>
            <div class="bg-[#1a120e] rounded-lg p-2">
              <div class="text-stone-400 mb-0.5">الاسم المستعار (Alias)</div>
              <div class="flex items-center justify-between gap-1">
                <span dir="ltr" class="font-black text-amber-400 text-sm">${CLIQ_ALIAS}</span>
                <button data-action="copy" data-key="alias" data-text="${CLIQ_ALIAS}" aria-label="نسخ" class="text-stone-300 hover:text-white">${copied === 'alias' ? CHECK : COPY}</button>
              </div>
            </div>
          </div>
          <div class="bg-[#1a120e] rounded-lg p-2 flex items-center justify-between text-[11px]">
            <div>
              <div class="text-stone-400 mb-0.5">المبلغ المطلوب تحويله</div>
              <div class="font-black text-amber-400 text-sm">${fmt(total)} د.أ</div>
            </div>
            <button data-action="copy" data-key="amount" data-text="${fmt(total)}" aria-label="نسخ المبلغ" class="text-stone-300 hover:text-white">${copied === 'amount' ? CHECK : COPY}</button>
          </div>
          <ol class="text-[10px] text-stone-300 leading-relaxed list-decimal pr-4 space-y-0.5">
            <li>افتح تطبيق بنكك أو محفظتك واختر «كليك».</li>
            <li>اختر التحويل إلى «اسم مستعار» وأدخل <b dir="ltr">${CLIQ_ALIAS}</b> (${CLIQ_BANK}).</li>
            <li>حوّل المبلغ <b>${fmt(total)} د.أ</b> ثم احتفظ بإشعار التحويل.</li>
          </ol>
          ${WHATSAPP_NUMBER ? `<a href="https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent('مرحباً، حوّلت عبر كليك إلى ' + CLIQ_ALIAS + ' (' + CLIQ_BANK + ') مبلغ ' + fmt(total) + ' د.أ لطلب: ' + ls.map(l => l.name + ' ' + qtyFmt(l.qty) + ' كيلو').join('، '))}" target="_blank" rel="noreferrer" class="block w-full text-center bg-green-600 hover:bg-green-700 text-white font-black text-xs py-2 rounded-xl">تم التحويل — أرسل الطلب عبر واتساب</a>` : ''}
        </div>`;
      }
      $('cart-sheet').innerHTML = html;
    }

    const setOpen = (v) => { $('cart-overlay').classList.toggle('hidden', !v); if (v) renderCart(); };

    document.addEventListener('click', async (e) => {
      const el = e.target.closest('[data-action]');
      if (!el) return;
      const a = el.dataset.action;
      if (a === 'close-overlay') { if (e.target === el) setOpen(false); return; }
      if (a === 'open') setOpen(true);
      else if (a === 'close') setOpen(false);
      else if (a === 'browse') $('products').scrollIntoView({ behavior: 'smooth' });
      else if (a === 'add') { // عند الإضافة للسلة تُفتح نافذة الدفع بالتحويل عبر كليك
        cart[el.dataset.id] = (cart[el.dataset.id] || 0) + 1;
        setOpen(true);
      }
      else if (a === 'qty') {
        const id = el.dataset.id;
        const q = Math.round(((cart[id] || 0) + parseFloat(el.dataset.delta)) * 2) / 2;
        if (q <= 0) delete cart[id]; else cart[id] = q;
        renderCart();
      }
      else if (a === 'copy') {
        try {
          await navigator.clipboard.writeText(el.dataset.text);
          copied = el.dataset.key; renderCart();
          setTimeout(() => { copied = ''; renderCart(); }, 1500);
        } catch (err) { /* النسخ غير مدعوم في هذا المتصفح */ }
      }
    });

    renderProducts();
    renderCart();
  </script>
</body>
</html>
